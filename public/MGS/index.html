<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGS</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10;
    color: #eaeaea;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(15,15,16,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #2a2a2d;
  }
  .head-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { margin: 2px 0 0; font-size: 12px; color: #888; }
  .search-box {
    background: #1a1a1c;
    border: 1px solid #2a2a2d;
    border-radius: 8px;
    color: #eaeaea;
    font-size: 13px;
    padding: 8px 12px;
    min-width: 180px;
  }
  .search-box::placeholder { color: #666; }
  .search-box:focus { outline: none; border-color: #4a4a4d; }

  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 70px; }

  .back-area { margin-bottom: 20px; display: none; }
  .back-btn {
    background: none;
    border: none;
    color: #999;
    padding: 6px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .back-btn:hover { color: #eaeaea; }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: #666;
    font-size: 14px;
    display: none;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .card {
    background: #1a1a1c;
    border: 1px solid #2a2a2d;
    border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: #3a3a3d;
    outline: none;
  }
  .img-box {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    overflow: hidden;
    position: relative;
  }
  .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-box .fallback {
    color: #555;
    font-size: 12px;
    text-align: center;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .card-info { padding: 10px 12px 12px; }
  .card-info h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
  .card-info p { margin: 2px 0 0; font-size: 11px; color: #777; }

  .detail-card .card-info p { text-align: center; }

  @media (max-width: 480px) {
    .head-inner { padding: 16px 18px; }
    .container { padding: 24px 18px 60px; }
  }
</style>
</head>
<body>

  <header>
    <div class="head-inner">
      <div>
        <h1 id="title">MGS</h1>
        <p class="sub" id="subtitle">15개 폴더</p>
      </div>
      <input type="search" id="searchInput" class="search-box" placeholder="폴더 검색…" aria-label="폴더 검색">
    </div>
  </header>

  <div class="container">
    <div class="back-area" id="backArea">
      <button class="back-btn" id="backBtn">&larr; 전체 목록으로</button>
    </div>

    <div class="gallery" id="categoryView"></div>
    <div class="gallery" id="detailView" style="display:none;"></div>
    <p class="empty-state" id="emptyState">일치하는 폴더가 없습니다</p>
  </div>

<script>
  const FOLDERS = ["CBM","CHR","CMU","DGL","DRL","DRN","FRC","GEG","HEY","HIT","JMR","LVL","MUS","PTE","VIT", "FDR", "MRS", "STR", "ZHK", "HDK", "HIR"];
  // 0~38, 40~81 (39는 없음)
  const IMAGE_INDICES = [];
  for (let i = 0; i <= 38; i++) IMAGE_INDICES.push(i);
  for (let i = 40; i <= 81; i++) IMAGE_INDICES.push(i);
  const IMAGES_PER_FOLDER = IMAGE_INDICES.length;

  const categoryView = document.getElementById('categoryView');
  const detailView = document.getElementById('detailView');
  const backArea = document.getElementById('backArea');
  const emptyState = document.getElementById('emptyState');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const searchInput = document.getElementById('searchInput');

  let currentFilter = '';

  function makeFallback(label) {
    const div = document.createElement('div');
    div.className = 'fallback';
    div.textContent = label;
    return div;
  }

  function buildImage(src, alt) {
    const img = document.createElement('img');
    img.src = src;
    img.loading = 'lazy';
    img.alt = alt;
    img.addEventListener('error', () => {
      const box = img.parentElement;
      img.remove();
      box.appendChild(makeFallback('no image'));
    }, { once: true });
    return img;
  }

  function renderCategoryView(filterText = '') {
    categoryView.innerHTML = '';
    const filtered = FOLDERS.filter(f => f.toLowerCase().includes(filterText.toLowerCase()));
    emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach(folder => {
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `${folder} 폴더 열기`);

      const imgBox = document.createElement('div');
      imgBox.className = 'img-box';
      imgBox.appendChild(buildImage(`${folder}/${folder}_0.webp`, folder));

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML = `<h3>${folder}</h3><p>이미지 ${IMAGES_PER_FOLDER}종</p>`;

      card.appendChild(imgBox);
      card.appendChild(info);

      const open = () => showDetail(folder);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });

      categoryView.appendChild(card);
    });
  }

  function showDetail(folder) {
    categoryView.style.display = 'none';
    detailView.style.display = 'grid';
    backArea.style.display = 'block';
    emptyState.style.display = 'none';
    searchInput.style.display = 'none';
    title.textContent = folder;
    subtitle.textContent = `이미지 ${IMAGES_PER_FOLDER}종`;

    detailView.innerHTML = '';

    IMAGE_INDICES.forEach(i => {
      const src = `${folder}/${folder}_${i}.webp`;

      const card = document.createElement('div');
      card.className = 'card detail-card';

      const imgBox = document.createElement('div');
      imgBox.className = 'img-box';
      imgBox.appendChild(buildImage(src, `${folder}_${i}`));

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML = `<p>${i}</p>`;

      card.appendChild(imgBox);
      card.appendChild(info);
      card.addEventListener('click', () => window.open(src, '_blank', 'noopener'));

      detailView.appendChild(card);
    });
  }

  function showMain() {
    categoryView.style.display = 'grid';
    detailView.style.display = 'none';
    backArea.style.display = 'none';
    searchInput.style.display = '';
    title.textContent = 'MGS';
    subtitle.textContent = '15개 폴더';
    renderCategoryView(currentFilter);
  }

  document.getElementById('backBtn').addEventListener('click', showMain);
  searchInput.addEventListener('input', e => {
    currentFilter = e.target.value;
    renderCategoryView(currentFilter);
  });

  renderCategoryView();
</script>
</body>
</html>
